<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A4C"/>
      <stop offset="100%" stop-color="#1A3B31"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49A89"/>
      <stop offset="100%" stop-color="#C27A65"/>
    </linearGradient>
  </defs>

  <!-- Background Circle / Glow -->
  <circle cx="100" cy="100" r="90" fill="#F9F6F0" />
  
  <!-- The Open Book forming the foundation -->
  <path d="M50,130 C50,130 75,120 100,130 C125,120 150,130 150,130 L145,145 C145,145 125,135 100,145 C75,135 55,145 55,145 Z" fill="url(#primaryGrad)" />
  <path d="M55,120 C55,120 75,110 100,120 C125,110 145,120 145,120 L140,135 C140,135 125,125 100,135 C75,125 60,135 60,135 Z" fill="#8EA896" opacity="0.8"/>
  <path d="M100,110 L100,145" stroke="#F9F6F0" stroke-width="3" stroke-linecap="round"/>

  <!-- The House / Community Roof -->
  <path d="M60,105 L100,65 L140,105" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Growing / Learning Leaves/Nodes -->
  <circle cx="100" cy="85" r="8" fill="url(#primaryGrad)" />
  <circle cx="80" cy="95" r="5" fill="#E2C792" />
  <circle cx="120" cy="95" r="5" fill="#E2C792" />
  <circle cx="90" cy="70" r="4" fill="#8EA896" />
  <circle cx="110" cy="70" r="4" fill="#8EA896" />

  <!-- Connection Lines (Subtle) -->
  <path d="M100,85 L80,95 M100,85 L120,95 M100,85 L90,70 M100,85 L110,70" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
